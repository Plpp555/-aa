name: Release

# タグ (v1.2.3 の形) を push すると、非公開の鍵で署名した APK を付けて GitHub Releases に公開する。
# 手順は DEVELOPMENT_NOTES.md の「リリース手順」を参照。
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # 公開鍵 (リポジトリ内の開発用の鍵) で署名した APK を公開しないよう、Secrets がなければ止める
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD を Settings > Secrets and variables > Actions に登録してください"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature and prepare files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="LiquidLauncher-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # 開発用の鍵 (公開されている) で署名されていたら止める
          if grep -qi "A1:8E:C5:9B\|a18ec59b" certs.txt; then
            echo "::error::開発用の鍵で署名されています"
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "CERT=$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //')" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # CHANGELOG.md の該当バージョンの節を本文にする
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "---"
            echo "**ダウンロード**: \`$APK\` (Android 6.0 以降)"
            echo ""
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
            echo ""
            echo "署名証明書の SHA-256: \`$CERT\`"
          } >> notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Liquid Launcher ${{ github.ref_name }}
          body_path: notes.md
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
