name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ビルドと lint の確認だけを行う (APK は置かない)。
      # テスト版 (debug) は「Android CI (debug)」(android-debug.yml)、公開版は Release ワークフローが置く
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -R app/build/outputs/apk | grep -i "\.apk$"

      # minSdk (Android 6.0) より新しい API を分岐なしで呼んでいないか (NewApi) を確認する
      - name: Lint (NewApi)
        run: ./gradlew --no-daemon lintStandardDebug lintIslandDebug || { cat app/build/reports/lint-results-*.txt; exit 1; }
