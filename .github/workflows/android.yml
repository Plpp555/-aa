name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug & release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      # テスト用の debug ビルドだけを置く (パッケージ名 com.aa.launcher.debug、開発用の鍵)。
      # 公開版は Release ワークフローが非公開の鍵で署名して GitHub Releases に置く
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: liquid-launcher-test-build
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APK のアップロード後に実行 (失敗してもジョブは赤になるが APK は取得できる)。
      # minSdk (Android 6.0) より新しい API を分岐なしで呼んでいないか (NewApi) を確認する
      - name: Lint (NewApi)
        run: ./gradlew --no-daemon lintDebug || { cat app/build/reports/lint-results-debug.txt; exit 1; }
