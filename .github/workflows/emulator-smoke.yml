name: Emulator smoke test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: smoke.sh
            api: 34
            profile: pixel_6
          - scenario: smoke2.sh
            api: 34
            profile: pixel_6
          # Android 6.0 (minSdk) での動作確認
          - scenario: smoke_legacy.sh
            api: 23
            profile: pixel_6
          # 大画面: タブレットは 1 ページ、折りたたみを開いた画面は 2 ページ表示
          - scenario: smoke_wide.sh
            api: 34
            profile: pixel_tablet
          # Pixel Fold の定義は CI の SDK にないので、タブレットの画面サイズを Fold の内側の画面に変えて再現する
          - scenario: smoke_wide.sh
            api: 34
            profile: pixel_tablet
            fold: 1
          # Dynamic Island 版: スマホ (切り欠きを再現)、Android 6.0 (切り欠きを取得できない)、タブレット (島を出さない)
          - scenario: smoke_island.sh
            api: 34
            profile: pixel_6
            flavor: island
          - scenario: smoke_island.sh
            api: 23
            profile: pixel_6
            flavor: island
          - scenario: smoke_island.sh
            api: 34
            profile: pixel_tablet
            flavor: island
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          if [ "${{ matrix.flavor }}" = island ]; then ./gradlew --no-daemon assembleIslandDebug; else ./gradlew --no-daemon assembleStandardDebug; fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: FLAVOR=${{ matrix.flavor || 'standard' }} FOLD_SIM=${{ matrix.fold || 0 }} bash .github/scripts/${{ matrix.scenario }}
