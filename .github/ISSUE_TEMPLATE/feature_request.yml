name: 要望 / Feature request
description: 新しい機能や改善の提案
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: 欲しい機能 / What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 理由・使い方 / Why
  - type: textarea
    id: reference
    attributes:
      label: 参考 (iOS の画面など) / References
